# Policy (2026-06-02): each domain serves ONLY its own pages.
#
# This snippet USED to 301 dock-side relative links (/hosts.html,
# /expense.html, …) to their owning subdomain. That cross-domain bounce
# is intentionally gone: the dock sidebar (polar-dock-ui) now links to
# absolute subdomain URLs (https://<svc>.4950.store:2443/<page>.html), so
# nothing on the dock domain navigates to a foreign module page anymore.
#
# A stale request for a module page on zen.4950.store (e.g. an old
# bookmark to /hosts.html) therefore falls through to the catch-all
# `location /` and returns 404 — a clean "not my page" rather than a
# silent redirect. Module pages live on their subdomains; the dock
# domain owns the dock pages only.
#
# The include is kept (no-op) so the zen vhost doesn't need editing if we
# ever reintroduce dock-scoped exact-match routes here.
