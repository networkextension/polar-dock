# Defensive 301s so dock-side sidebar nav targets (which use relative
# paths like /expense.html, /projects.html) keep working after each
# plugin's dock-side UI files are dropped.
#
# Each plugin owns its UI under <svc>.4950.store:2443 (per the
# `polar-plugin-subdomains.conf` per-plugin server{} blocks). When a
# user clicks "Expense" in the sidebar of /dashboard.html on
# zen.4950.store, the browser navigates to /expense.html — this snippet
# bounces them to the canonical subdomain. Once each plugin's UI is
# rebuilt + redeployed and the dock-side <svc>.html file is removed,
# the only thing that keeps the link working is this redirect.
#
# Install on .57 — add this include inside the zen.4950.store
# server{} block in the zen vhost (`/opt/homebrew/etc/nginx/servers/ssl`)
# BEFORE the catch-all `location /` block so the location =
# matches win first:
#
#     include snippets/polar-zen-redirects.conf;
#
# Then:
#     sudo install -m 0644 polar-zen-redirects.conf /opt/homebrew/etc/nginx/snippets/
#     sudo /opt/homebrew/bin/nginx -t && sudo /opt/homebrew/bin/nginx -s reload
#
# `location =` is exact-match — it does NOT shadow paths like
# /expense-report.html or /api/expenses. Each redirect is one-to-one.
#
# Status (2026-05-23): 8 plugin pages, one per extracted plugin.
# packtunnel has no UI page so it's not listed. video uses
# `video-studio.html` (not `video.html`); wg uses `wg-tokens.html`.

location = /expense.html      { return 301 https://expense.4950.store:2443/expense.html; }
location = /projects.html     { return 301 https://project.4950.store:2443/projects.html; }
location = /latch.html        { return 301 https://latch.4950.store:2443/latch.html; }
location = /hosts.html        { return 301 https://hosts.4950.store:2443/hosts.html; }
location = /iosdist.html      { return 301 https://iosdist.4950.store:2443/iosdist.html; }
location = /library.html      { return 301 https://library.4950.store:2443/library.html; }
location = /video-studio.html { return 301 https://video.4950.store:2443/video-studio.html; }
location = /wg-tokens.html    { return 301 https://wg.4950.store:2443/wg-tokens.html; }
