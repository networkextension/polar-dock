# polar-plugins.conf — consolidated forward map of plugin paths → plugin svc
#
# Drop this file into nginx's snippets dir and `include` from the polar
# vhost AFTER the `location /` (dock fallback) block is set up. Order
# matters: nginx picks the longest `^~` literal-prefix match before any
# regex, so the agent-stays-in-dock carve-outs (iosdist agent) are
# expressed with `^~` and proxy back to :8080.
#
# Plugin ports are 8090-8098 contiguous, one per plugin. Each plugin's
# own nginx snippet (in github.com/networkextension/polar-<svc>/scripts/
# nginx) remains the source of truth; this file is a deploy convenience
# so .57 + other dock instances have one include instead of nine.
#
# Pre-requisite: each plugin svc must be running + heartbeating + listed
# in dock's plugin_modules table with the right port.
#
# Install (.57):
#   sudo install -m 0644 polar-plugins.conf /opt/homebrew/etc/nginx/snippets/
#   # then in the polar vhost, add:  include snippets/polar-plugins.conf;
#   sudo /opt/homebrew/bin/nginx -t && sudo /opt/homebrew/bin/nginx -s reload
#
# Port map:
#   8080  dock (identity + LLM proxy + chat + agent_hub)
#   8090  polar-wg-svc
#   8091  polar-iosdist-svc
#   8092  polar-video-svc
#   8093  polar-packtunnel-svc
#   8094  polar-library-svc
#   8095  polar-hosts-svc       (PENDING cutover — flag exists but not flipped)
#   8096  polar-projects-svc    (PENDING cutover)
#   8097  polar-expense-svc
#   8098  polar-latch-svc
#
# Status (2026-05-22):
#   ✓ active routing in this file: wg, packtunnel, library, video, expense, latch, iosdist
#   ⏳ commented-out: projects, hosts (flip POLAR_<SVC>_REMOTE on dock + uncomment here)

# ─── iosdist agent stays in dock (PolarAgentAuthMiddleware) ───────────────
location ^~ /api/iosdist/agent/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ─── wg-svc (8090): control plane + admin ─────────────────────────────────
location ~ ^/v1/(register|peers|hub/peers|dns|heartbeat|leave|token/refresh|install|bundle) {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /api/admin/wg-hubs    { proxy_pass http://127.0.0.1:8090; include snippets/polar-proxy-headers.conf; }
location ^~ /api/admin/wg-tokens  { proxy_pass http://127.0.0.1:8090; include snippets/polar-proxy-headers.conf; }
location ^~ /api/admin/wg-devices { proxy_pass http://127.0.0.1:8090; include snippets/polar-proxy-headers.conf; }
location ^~ /api/admin/wg-sites   { proxy_pass http://127.0.0.1:8090; include snippets/polar-proxy-headers.conf; }
location ^~ /api/admin/wg-bundles { proxy_pass http://127.0.0.1:8090; include snippets/polar-proxy-headers.conf; }

# ─── iosdist (8091): admin + public install + share + plaza ───────────────
# The agent carve-out above (^~ /api/iosdist/agent/) takes priority.
location ~ ^/api/iosdist/ {
    proxy_pass http://127.0.0.1:8091;
    include snippets/polar-proxy-headers.conf;
    client_max_body_size 512m;     # IPA uploads
    proxy_read_timeout 600s;
}
location ~ ^/iosdist/(install|manifest|share|plaza) {
    proxy_pass http://127.0.0.1:8091;
    include snippets/polar-proxy-headers.conf;
}

# ─── video (8092): video-llm-configs + video-projects (dash, not slash) ───
location ~ ^/api/video-(llm-configs|projects) {
    proxy_pass http://127.0.0.1:8092;
    include snippets/polar-proxy-headers.conf;
    client_max_body_size 512m;     # video asset uploads
    proxy_read_timeout 600s;
}

# ─── packtunnel (8093): + legacy /api/proxy-configs aliases ───────────────
location ~ ^/api/packtunnel/ {
    proxy_pass http://127.0.0.1:8093;
    include snippets/polar-proxy-headers.conf;
}
location ~ ^/api/proxy-configs {
    proxy_pass http://127.0.0.1:8093;
    include snippets/polar-proxy-headers.conf;
}

# ─── library (8094): /api/library/{devices,firmwares,functions} ───────────
# rev_agent_handlers stays in dock (PolarAgentAuthMiddleware) but uses
# /api/agent/library/devices/upsert, not /api/library/* — no carve-out needed.
location ~ ^/api/library/ {
    proxy_pass http://127.0.0.1:8094;
    include snippets/polar-proxy-headers.conf;
    client_max_body_size 1g;       # firmware blob uploads
    proxy_read_timeout 600s;
}

# ─── expense (8097): expense-categories + expenses + from-image + image ───
location ~ ^/api/(expenses|expense-categories) {
    proxy_pass http://127.0.0.1:8097;
    include snippets/polar-proxy-headers.conf;
    client_max_body_size 30m;      # receipt image uploads
    proxy_read_timeout 120s;       # vision-LLM extraction latency
}

# ─── latch (8098): full /api/latch/* surface ──────────────────────────────
location ^~ /api/latch/ {
    proxy_pass http://127.0.0.1:8098;
    include snippets/polar-proxy-headers.conf;
}

