# ─── wg.4950.store ────────────────────────────────────────────────────────
# Also keeps the wg-svc admin + control-plane inline routes (the deployed
# polar-plugins.conf snippet on .57 predates the wg additions in the repo
# copy; cleanup is a separate followup PR).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wg.4950.store;
    ssl_certificate     /Users/local/etc/letsencrypt/live/4950.store/fullchain.pem;
    ssl_certificate_key /Users/local/etc/letsencrypt/live/4950.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    root  /Users/local/var/polar-ui/wg;
    index wg-tokens.html;
    client_max_body_size 500M;

    include snippets/polar-plugins.conf;
    location ~ ^/v1/(register|peers|hub/peers|dns|heartbeat|leave|token/refresh|install|bundle) {
        proxy_pass http://127.0.0.1:8090;
        include snippets/polar-proxy-headers.conf;
    }
    location ^~ /api/admin/wg-hubs    { proxy_pass http://127.0.0.1:8090; include snippets/polar-proxy-headers.conf; }
    location ^~ /api/admin/wg-tokens  { proxy_pass http://127.0.0.1:8090; include snippets/polar-proxy-headers.conf; }
    location ^~ /api/admin/wg-devices { proxy_pass http://127.0.0.1:8090; include snippets/polar-proxy-headers.conf; }
    location ^~ /api/admin/wg-sites   { proxy_pass http://127.0.0.1:8090; include snippets/polar-proxy-headers.conf; }
    location ^~ /api/admin/wg-bundles { proxy_pass http://127.0.0.1:8090; include snippets/polar-proxy-headers.conf; client_max_body_size 200m; proxy_read_timeout 300s; }
    location /api/proxy/v1/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 1800s; proxy_send_timeout 1800s; chunked_transfer_encoding on; }
    location /api { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 600s; proxy_send_timeout 600s; }
    location /ws/ { proxy_pass http://127.0.0.1:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 3600s; proxy_send_timeout 3600s; }
    location / { try_files $uri @dock_dist; }
    location @dock_dist { root /Users/local/github/Polar-/ui/dist; try_files $uri =404; }
}

# ─── packtunnel.4950.store: no UI; serves plugin API + redirects /  ──────
# packtunnel has no .html page. If a user hits the bare subdomain we
# bounce them to the (current) home on zen rather than 404. /api/* still
# routes to the plugin via polar-plugins.conf.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name packtunnel.4950.store;
    ssl_certificate     /Users/local/etc/letsencrypt/live/4950.store/fullchain.pem;
    ssl_certificate_key /Users/local/etc/letsencrypt/live/4950.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    client_max_body_size 500M;

    include snippets/polar-plugins.conf;
    location /api { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; proxy_read_timeout 600s; }
    location = / { return 302 https://zen.4950.store:2443/; }
    location / { return 404; }
}
