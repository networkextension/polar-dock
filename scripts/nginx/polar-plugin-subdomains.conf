# Plugin-per-subdomain vhost.
#
# One subdomain per plugin so each plugin's UI can iterate independently
# (and eventually carry its own ui/dist served from its plugin repo)
# without coordinating with sibling plugins. All 9 subdomains share the
# wildcard `*.4950.store` cert and the existing polar-plugins.conf
# fan-out, so today they all serve the same dock /ui/dist + same API
# routing as zen.4950.store — only the hostname differs.
#
# Install on .57:
#   sudo install -m 0644 polar-plugin-subdomains.conf \
#       /opt/homebrew/etc/nginx/servers/polar-plugin-subdomains.conf
#   sudo /opt/homebrew/bin/nginx -t && sudo /opt/homebrew/bin/nginx -s reload
#
# DNS: one wildcard A record `*.4950.store -> <public IP>` covers all 9.
#
# Later, when a plugin's UI extracts to its own repo (Track 4 of the
# extraction plan), split that subdomain out into its own server block
# with `root /path/to/plugin-ui/dist;` and remove it from the
# server_name list here. The wildcard cert keeps working without a
# rotation.
#
# Cookie-domain follow-up: dock currently sets the session cookie with
# domain=zen.4950.store, so a login on zen will NOT carry to these
# subdomains. To make SSO across subdomains work, dock must set
# domain=.4950.store on its access + refresh cookies. Until that lands,
# users on a plugin subdomain bounce back to zen for login.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name
        project.4950.store
        latch.4950.store
        hosts.4950.store
        iosdist.4950.store
        library.4950.store
        video.4950.store
        packtunnel.4950.store
        wg.4950.store
        ;

    ssl_certificate     /Users/local/etc/letsencrypt/live/4950.store/fullchain.pem;
    ssl_certificate_key /Users/local/etc/letsencrypt/live/4950.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    root  /Users/local/github/Polar-/ui/dist;
    index index.html index.htm;
    client_max_body_size 500M;

    # Per-plugin API fan-out (same map zen uses).
    include snippets/polar-plugins.conf;

    # wg-svc admin + control-plane routes — these live in the zen vhost
    # inline because the deployed polar-plugins.conf snippet predates the
    # wg additions in the repo copy. Duplicated here so subdomains
    # (especially wg.4950.store) reach wg-svc the same way.
    location ~ ^/v1/(register|peers|hub/peers|dns|heartbeat|leave|token/refresh|install|bundle) {
        proxy_pass http://127.0.0.1:8090;
        include snippets/polar-proxy-headers.conf;
    }
    location ^~ /api/admin/wg-hubs    { proxy_pass http://127.0.0.1:8090; include snippets/polar-proxy-headers.conf; }
    location ^~ /api/admin/wg-tokens  { proxy_pass http://127.0.0.1:8090; include snippets/polar-proxy-headers.conf; }
    location ^~ /api/admin/wg-devices { proxy_pass http://127.0.0.1:8090; include snippets/polar-proxy-headers.conf; }
    location ^~ /api/admin/wg-sites   { proxy_pass http://127.0.0.1:8090; include snippets/polar-proxy-headers.conf; }
    location ^~ /api/admin/wg-bundles { proxy_pass http://127.0.0.1:8090; include snippets/polar-proxy-headers.conf; client_max_body_size 200m; proxy_read_timeout 300s; }

    # LLM proxy — long-running streamed completions.
    location /api/proxy/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        chunked_transfer_encoding on;
    }

    # Everything else under /api/* goes to dock; the polar-plugins
    # snippet above already carved out plugin routes, so this is the
    # dock fallback (identity, chat, agent, llm-billing, etc.).
    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # WebSocket — chat, agent attach, host shell/vnc bridge.
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static UI files from dock's /ui/dist. Initial state: every
    # subdomain serves the same bundle, so admin can land on
    # project.4950.store/expense.html etc. and still get a working page.
    # Per-plugin UI extraction later will pin each subdomain to its
    # own root.
    location / {
        try_files $uri $uri/ /index.html =404;
    }
}

# ─── expense.4950.store: first per-plugin UI extraction (pilot) ───────────
# Plugin owns its build at /Users/local/var/polar-ui/expense/ (rsync'd
# by polar-expense's scripts/deploy-ui.sh). Cross-page sidebar links
# (/dashboard.html, /llm-billing.html, etc.) fall back to dock's
# /ui/dist via @dock_dist so the user can navigate out of expense.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name expense.4950.store;

    ssl_certificate     /Users/local/etc/letsencrypt/live/4950.store/fullchain.pem;
    ssl_certificate_key /Users/local/etc/letsencrypt/live/4950.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    root  /Users/local/var/polar-ui/expense;
    index expense.html;
    client_max_body_size 500M;

    # Plugin API fan-out + LLM proxy + WS + fallback /api -> dock —
    # identical to the shared plugin-subdomain vhost above.
    include snippets/polar-plugins.conf;
    location /api/proxy/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        chunked_transfer_encoding on;
    }
    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static UI: plugin's own files first, fall back to dock's bundle
    # so cross-page sidebar links keep working until every plugin extracts.
    location / {
        try_files $uri @dock_dist;
    }
    location @dock_dist {
        root /Users/local/github/Polar-/ui/dist;
        try_files $uri =404;
    }
}
