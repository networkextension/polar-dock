# Per-plugin subdomain vhosts.
#
# Each plugin's UI is owned by its own repo (built via the polar-ui-common
# npm package), shipped to /Users/local/var/polar-ui/<svc>/ by the plugin's
# scripts/deploy-ui.sh. Each subdomain has a dedicated server{} block with
# root = the plugin's dist dir + a try_files chain to @dock_dist so
# cross-page sidebar links (/dashboard.html, /llm-billing.html, etc.) still
# resolve from dock's /ui/dist until every dock page extracts too.
#
# Subdomains map (all share the wildcard *.4950.store cert):
#   expense.4950.store    polar-expense       (pilot — PR dock#312)
#   project.4950.store    polar-projects
#   latch.4950.store      polar-latch
#   hosts.4950.store      polar-hosts         (2 entries: hosts.js + hosts-shell.js)
#   iosdist.4950.store    polar-iosdist
#   library.4950.store    polar-library
#   video.4950.store      polar-video         (video-studio.html)
#   wg.4950.store         polar-wg            (wg-tokens.html)
#   packtunnel.4950.store polar-packtunnel    (no UI — API + redirect only)
#
# DNS: wildcard `*.4950.store A 58.37.118.182` covers all of them.
# Public access: :2443 (router hairpin). Internal: :443.
#
# Install on .57:
#   sudo install -m 0644 polar-plugin-subdomains.conf \
#       /opt/homebrew/etc/nginx/servers/polar-plugin-subdomains.conf
#   sudo /opt/homebrew/bin/nginx -t && sudo /opt/homebrew/bin/nginx -s reload

# ────────────────────────────────────────────────────────────────────────
# Reusable bits — copy-paste-able. Every plugin server{} below shares this
# shape; only `server_name`, `root`, and `index` differ.
#
# include snippets/polar-plugins.conf;            # plugin API fan-out
# location /api/proxy/v1/ { ... }                 # LLM proxy long-timeout
# location /api { ... }                           # dock fallback for /api/*
# location /ws/ { ... }                           # WS (chat, agent, shell, vnc)
# location / { try_files $uri @dock_dist; }       # plugin UI first
# location @dock_dist { root .../ui/dist; ... }   # dock UI fallback
# ────────────────────────────────────────────────────────────────────────

# ─── expense.4950.store ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name expense.4950.store;

    ssl_certificate     /Users/local/etc/letsencrypt/live/4950.store/fullchain.pem;
    ssl_certificate_key /Users/local/etc/letsencrypt/live/4950.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    root  /Users/local/var/polar-ui/expense;
    index expense.html;
    client_max_body_size 500M;

    include snippets/polar-plugins.conf;
    location /api/proxy/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        chunked_transfer_encoding on;
    }
    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / {
        try_files $uri @dock_dist;
    }
    location @dock_dist {
        root /Users/local/github/Polar-/ui/dist;
        try_files $uri =404;
    }
}

