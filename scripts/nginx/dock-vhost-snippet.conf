# Snippet for the polar-dock vhost (zen.4950.store / equivalent).
#
# Drop these directives into the matching `server { ... }` block on
# the deploy box, then `nginx -t && nginx -s reload`.
#
# Why this exists: nginx's default `client_max_body_size` is 1 MB. Any
# chat attachment larger than that gets rejected by nginx with HTTP
# 413 before it reaches the dock backend — the backend's own 200 MB
# cap (chatAttachmentMaxFileSize in chat_handlers.go) never sees the
# request. Plugin subdomains (expense / library / video / iosdist / …)
# already set 500m in scripts/nginx/polar-plugin-subdomains.conf; the
# dock vhost needs a matching directive.

client_max_body_size 200m;

# nginx default proxy_read_timeout is 60s; large uploads + slow upstream
# storage (R2 write) can exceed this. 5 min covers a 200 MB upload at
# typical home-line speeds.
proxy_read_timeout 300s;
