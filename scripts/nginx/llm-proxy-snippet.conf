# nginx snippet for LLM proxy paths.
#
# LLM completions can take 5-10min (long completion + thinking
# traces), and streaming connections often last just as long. The
# default nginx proxy_read_timeout is 60s, which silently kills
# them with a 504 Gateway Timeout before the upstream replies.
#
# Drop this BEFORE the general `location /api { ... }` block in your
# vhost — more-specific match wins per nginx's location-matching
# rules. Example layout:
#
#   server {
#     server_name zen.example.com;
#     listen 443 ssl;
#     # ... ssl_certificate / root / etc ...
#
#     include /opt/homebrew/etc/nginx/snippets/llm-proxy.conf;  # this file
#     location /api {
#       proxy_pass http://127.0.0.1:8080;
#       proxy_read_timeout 600s;     # general API also wants > 60s
#       # ... your existing /api block ...
#     }
#     # ... rest of vhost ...
#   }

location /api/proxy/v1/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;
    proxy_http_version 1.1;

    # SSE / chunked transfer for streaming completions.
    proxy_buffering off;
    chunked_transfer_encoding on;

    # 30-minute upstream timeout — covers thinking-mode Qwen, deep
    # research multi-step, long code-gen, etc.
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
}
