# Local quickstart for self-hosters. Pulls the published multi-arch
# polar-dock image + runs Postgres + Redis next to it. Override
# any env via a .env file or shell exports.
#
#   cp .env.example .env  # if you have one
#   docker compose pull
#   docker compose up -d
#
# Then visit http://localhost:8080.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polar}
      POSTGRES_DB: ${POSTGRES_DB:-polar}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  dock:
    image: ghcr.io/networkextension/polar-dock:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${DOCK_PORT:-8080}:8080"
    environment:
      ADDR: ":8080"
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-polar}:${POSTGRES_PASSWORD:-polar}@postgres:5432/${POSTGRES_DB:-polar}?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8080}"
      # polar-agent binaries are baked into the image at /app/dist/agents,
      # POLAR_AGENT_DIST_DIR set in the Dockerfile. To override with
      # fresher builds, mount a dir + override the env here.
    volumes:
      - dock-data:/data

  # The static UI lives in its own repo (networkextension/polar-dock-ui)
  # and is no longer baked into this image. To serve it locally, build
  # polar-dock-ui (`npm ci && npm run build` in that repo), then point
  # any static server at its dist/ — examples:
  #
  #   nginx { root /path/to/polar-dock-ui/dist; ... try_files; proxy /api → dock:8080 }
  #
  #   docker run --rm -v /path/to/polar-dock-ui/dist:/usr/share/nginx/html:ro \
  #     -p 3000:80 nginx:alpine
  #
  # Or use the polar-dock-ui repo's own server.js (express dev preview).

volumes:
  pg-data:
  redis-data:
  dock-data:
