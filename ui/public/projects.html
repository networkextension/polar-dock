<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n-title="projects.title">项目</title>
    <link rel="icon" type="image/svg+xml" href="/assets/polaris-logo.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="lp-page">
    <div class="lp-app">
      <aside class="lp-sidebar">
        <a class="lp-brand" href="/dashboard.html" data-site-brand>
          <img data-site-icon alt="" />
          <span class="lp-brand-name" data-site-name>Polar-</span>
        </a>
        <nav class="lp-nav">
          <a class="lp-nav-item" href="/dashboard.html">
            <span class="lp-nav-icon">⊞</span><span>Dashboard</span>
          </a>
          <a class="lp-nav-item" href="/teams.html">
            <span class="lp-nav-icon">⌂</span><span data-i18n="nav.teams">工作区</span>
          </a>
          <a class="lp-nav-item active" href="/projects.html">
            <span class="lp-nav-icon">✦</span><span data-i18n="nav.projects">项目</span>
          </a>
          <a class="lp-nav-item" href="/posts.html">
            <span class="lp-nav-icon">◎</span><span>Posts</span>
          </a>
          <a class="lp-nav-item" href="/markdowns.html">
            <span class="lp-nav-icon">◈</span><span>Markdowns</span>
          </a>
          <a class="lp-nav-item" href="/chat.html">
            <span class="lp-nav-icon">◉</span><span>Chat</span>
          </a>
          <a class="lp-nav-item" href="/video-studio.html">
            <span class="lp-nav-icon">▶</span><span data-i18n="nav.videoStudio">Video Studio</span>
          </a>
          <a class="lp-nav-item" href="/iosdist.html">
            <span class="lp-nav-icon">⬇</span><span data-i18n="nav.iosDist">iOS 分发</span>
          </a>
          <a class="lp-nav-item" href="/editor.html">
            <span class="lp-nav-icon">✎</span><span>Editor</span>
          </a>
          <a class="lp-nav-item" href="/latch.html" hidden data-admin-nav>
            <span class="lp-nav-icon">⚙</span><span data-i18n="nav.latch">Latch</span>
          </a>
          <a class="lp-nav-item" href="/bots.html" hidden data-admin-nav>
            <span class="lp-nav-icon">◉</span><span data-i18n="nav.bots">Bot Management</span>
          </a>
          <a class="lp-nav-item" href="/admin.html" hidden data-admin-nav>
            <span class="lp-nav-icon">☍</span><span data-i18n="nav.userAdmin">用户管理</span>
          </a>
        </nav>
        <div class="lp-sidebar-foot">
          <div class="lp-foot-avatar" id="lpFootAvatar">U</div>
          <div class="lp-foot-info">
            <div class="lp-foot-name" id="lpFootName">—</div>
            <div class="lp-foot-role" id="lpFootRole">—</div>
          </div>
          <div class="lp-sidebar-foot-actions">
            <button class="lp-foot-icon-btn" type="button" data-open-settings-center data-settings-target="personalization" title="Settings" data-i18n-tooltip="nav.settings">⚙</button>
            <button id="logoutBtn" class="lp-foot-icon-btn" type="button" title="Log out">⏻</button>
          </div>
        </div>
      </aside>

      <div class="lp-main" style="overflow:hidden;">
        <div class="lp-topbar">
          <span class="lp-topbar-title" data-i18n="projects.title">项目</span>
          <div class="lp-topbar-end" style="display:flex; align-items:center; gap:8px;">
            <button id="projectsNewBtn" class="btn-inline btn-secondary" type="button">＋ 新建项目</button>
            <a class="lp-topbar-back" href="/dashboard.html">Dashboard</a>
          </div>
        </div>

        <div class="lp-content" style="padding:0; overflow:hidden; flex:1; display:flex;">
          <div class="video-studio-layout">
            <!-- Left: project list -->
            <aside class="video-studio-projects">
              <div class="video-studio-projects-head">
                <span class="badge">项目</span>
              </div>
              <div id="projectsList" class="video-studio-project-list">
                <div class="chat-empty">加载中...</div>
              </div>
            </aside>

            <!-- Right: project detail -->
            <section class="video-studio-detail" id="projectDetail">
              <div class="video-studio-empty" id="projectsEmpty">
                <div class="chat-empty">从左侧选择项目，或点右上角新建</div>
              </div>

              <div id="projectsPanel" hidden style="padding:20px; display:flex; flex-direction:column; gap:18px; overflow:auto;">
                <header style="display:flex; align-items:flex-start; gap:14px;">
                  <div style="flex:1; min-width:0;">
                    <h2 id="projectsName" style="margin:0 0 4px 0; font-size:20px; font-weight:600;">—</h2>
                    <div style="font-size:12px; color:var(--text-muted,#888); display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                      <span id="projectsStatusPill" class="settings-value-pill" style="font-size:11px;">—</span>
                      <span id="projectsCreatedAt"></span>
                    </div>
                  </div>
                  <button id="projectsDeleteBtn" class="btn-inline" type="button" style="color:#c33; font-size:12px;">删除</button>
                </header>

                <!-- 描述 + decompose -->
                <section style="display:flex; flex-direction:column; gap:10px;">
                  <div style="font-weight:600; font-size:14px;">产品描述</div>
                  <textarea id="projectsDescription" class="input textarea" rows="6" placeholder="一句话描述这个 app 想做什么；越具体越好（题材、目标人群、核心交互、预期最终形态）"></textarea>
                  <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                    <button id="projectsSaveDescBtn" class="btn-inline btn-secondary" type="button">保存描述</button>
                    <button id="projectsDecomposeBtn" class="btn-inline btn-secondary" type="button" style="background:#3a7;color:#fff;">AI 拆解功能 →</button>
                    <span id="projectsDecomposeStatus" class="status-text"></span>
                  </div>
                </section>

                <!-- Features -->
                <section style="display:flex; flex-direction:column; gap:10px;" id="projectsFeaturesSection" hidden>
                  <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
                    <div style="font-weight:600; font-size:14px;">建议功能 <span id="projectsFeaturesCount" style="color:var(--text-muted,#888); font-size:12px; font-weight:400;"></span></div>
                    <button id="projectsGeneratePlanBtn" class="btn-inline btn-secondary" type="button">生成开发计划 →</button>
                  </div>
                  <div id="projectsFeaturesList" style="display:flex; flex-direction:column; gap:6px;"></div>
                  <div id="projectsPlanStatus" class="status-text"></div>
                </section>

                <!-- Tasks -->
                <section style="display:flex; flex-direction:column; gap:10px;" id="projectsTasksSection" hidden>
                  <div style="font-weight:600; font-size:14px;">任务 <span id="projectsTasksCount" style="color:var(--text-muted,#888); font-size:12px; font-weight:400;"></span></div>
                  <div id="projectsTasksList" style="display:flex; flex-direction:column; gap:6px;"></div>
                </section>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>

    <!-- Create project modal -->
    <div id="projectsCreateModal" class="modal" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-card" role="dialog" aria-modal="true">
        <div class="modal-header">
          <h3>新建项目</h3>
          <button id="projectsCreateModalCloseBtn" class="btn-inline btn-secondary" type="button">关闭</button>
        </div>
        <form id="projectsCreateForm" class="modal-body">
          <label class="form-label" for="projectsCreateName">项目名称</label>
          <input id="projectsCreateName" class="input" type="text" required maxlength="120" placeholder="例如：宋词地图" />

          <label class="form-label" for="projectsCreateDescription">产品描述（可后填）</label>
          <textarea id="projectsCreateDescription" class="input textarea" rows="4" placeholder="描述你想做的 app —— 它做什么、为谁、有哪些核心场景"></textarea>

          <div id="projectsCreateStatus" class="status-text"></div>
          <div class="modal-actions">
            <button id="projectsCreateSubmitBtn" class="btn-secondary" type="submit">创建</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="/scripts/projects.js"></script>
  </body>
</html>
