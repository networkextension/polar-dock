<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Console — Polar-</title>
    <link rel="icon" type="image/svg+xml" href="/assets/polaris-logo.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .console-grid {
        display: grid;
        gap: 6px;
        padding: 6px;
        background: #0b1220;
        flex: 1;
        min-height: 0;
      }
      .console-grid[data-cols="1"] { grid-template-columns: 1fr; }
      .console-grid[data-cols="2"] { grid-template-columns: 1fr 1fr; }
      .console-grid[data-cols="3"] { grid-template-columns: 1fr 1fr 1fr; }
      .console-pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: #0f172a;
        border-radius: 6px;
        overflow: hidden;
      }
      .console-pane-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        background: #1e293b;
        color: #e2e8f0;
        font-size: 12px;
      }
      .console-pane-head .console-pane-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .console-pane-head select, .console-pane-head button {
        font-size: 11px;
      }
      .console-pane-body {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      .console-pane-empty {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        color: #94a3b8;
        font-size: 12px;
      }
      .console-pane-empty select {
        max-width: 280px;
      }
      .console-pane-term {
        position: absolute;
        inset: 0;
      }
      .console-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        background: #1e293b;
        border-bottom: 1px solid #0b1220;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body class="lp-page">
    <div class="lp-app">
      <aside class="lp-sidebar">
        <a class="lp-brand" href="/dashboard.html" data-site-brand>
          <img data-site-icon alt="" />
          <span class="lp-brand-name" data-site-name>Polar-</span>
        </a>
        <nav class="lp-nav">
          <a class="lp-nav-item" href="/dashboard.html">
            <span class="lp-nav-icon" data-icon="layout-dashboard">⊞</span><span>Dashboard</span>
          </a>
          <a class="lp-nav-item" href="/hosts.html">
            <span class="lp-nav-icon" data-icon="server">▣</span><span>主机</span>
          </a>
          <a class="lp-nav-item active" href="/console.html">
            <span class="lp-nav-icon" data-icon="terminal">▶</span><span>Console</span>
          </a>
          <a class="lp-nav-item" href="/chat.html">
            <span class="lp-nav-icon" data-icon="message-circle">◉</span><span>Chat</span>
          </a>
          <a class="lp-nav-item" href="/editor.html">
            <span class="lp-nav-icon" data-icon="code">✎</span><span>Editor</span>
          </a>
        </nav>
        <div class="lp-sidebar-foot">
          <div class="lp-foot-avatar" id="lpFootAvatar">U</div>
          <div class="lp-foot-info">
            <div class="lp-foot-name" id="lpFootName">—</div>
            <div class="lp-foot-role" id="lpFootRole">—</div>
          </div>
          <div class="lp-sidebar-foot-actions">
            <button id="logoutBtn" class="lp-foot-icon-btn" type="button" title="Log out"><span data-icon="log-out"></span></button>
          </div>
        </div>
      </aside>

      <div class="lp-main" style="overflow:hidden;">
        <div class="console-toolbar">
          <strong style="font-size:13px;">Console</strong>
          <span style="font-size:11px; color:#94a3b8;">多终端并排工作区</span>
          <span style="flex:1;"></span>
          <label style="font-size:12px;">布局
            <select id="consoleLayoutSelect" style="margin-left:4px;">
              <option value="1">1 pane</option>
              <option value="2">2 panes</option>
              <option value="3">3 panes</option>
              <option value="4" selected>2×2</option>
              <option value="6">2×3</option>
              <option value="9">3×3</option>
            </select>
          </label>
          <label style="font-size:12px;">已保存
            <select id="consoleSavedSelect" style="margin-left:4px; min-width:140px;">
              <option value="">— 未保存的布局 —</option>
            </select>
          </label>
          <button id="consoleSaveBtn" class="btn-inline btn-secondary" type="button" title="保存当前布局">💾 保存</button>
          <button id="consoleDeleteBtn" class="btn-inline btn-secondary" type="button" disabled title="删除选中的已保存布局">🗑</button>
          <button id="consoleCloseAllBtn" class="btn-inline btn-secondary" type="button">关闭全部</button>
          <a class="lp-topbar-back" href="/hosts.html">主机</a>
        </div>

        <div id="consoleGrid" class="console-grid" data-cols="2"></div>
      </div>
    </div>

    <script type="module" src="/scripts/console.js"></script>
  </body>
</html>
